name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # build/ (extracted Acrobat JS) is gitignored intermediate output, not checked
      # in. tests/unit/build-data.spec.ts loads build/js via createRulesContext(JS_DIR),
      # so without this step a clean CI checkout fails with ENOENT before a single
      # assertion runs. Also regenerates app/data/*.json, which must stay byte-identical
      # to what's committed (verified locally; not re-diffed here to keep CI simple).
      # Must precede `npm test` and anything else that reads app/data.
      # Takes roughly a minute.
      - name: Generate rules data from the source PDF
        run: npm run build:data

      - name: Typecheck
        run: npm run typecheck

      - name: Compile TypeScript to app/js
        run: npm run build

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - uses: actions/configure-pages@v5

      # Only app/ is published - it is the whole site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
